name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: ShellCheck
        run: shellcheck -x debloat.sh lib/*.sh tests/*.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: Stubbed apply and restore
        run: bash tests/test_stubbed.sh
      - name: Dry run on the real runner (changes nothing)
        run: bash debloat.sh -c all
